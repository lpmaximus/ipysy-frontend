# Proxy reverso para o API Gateway
# Usado pelo docker-compose.infrastructure.yml em dev isolado

server {
    listen 8080;
    server_name _;

    # Health check do próprio proxy
    location /health {
        access_log off;
        return 200 "proxy-ok\n";
        add_header Content-Type text/plain;
    }

    # Roteamento WebSocket (necessário para notificações em tempo real)
    location /api/v1/ws {
        proxy_pass          ${GATEWAY_UPSTREAM};
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # Roteamento REST → Gateway
    location /api/ {
        proxy_pass          ${GATEWAY_UPSTREAM};
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  30s;
        proxy_send_timeout  30s;

        # CORS para dev local
        add_header Access-Control-Allow-Origin  "http://localhost" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
